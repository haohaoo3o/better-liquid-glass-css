<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>liquid-glass — optics test</title>
<style>
  :root { --ink: #f2f4f7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #06090c; }
  body { font-family: "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .stage {
    position: relative;
    width: 1600px; height: 900px;
    margin: 0 auto; overflow: hidden;
    isolation: isolate;
  }

  /* High-contrast line pairs: the classic refractive test target. */
  .lg-bg {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg,
        rgba(226, 236, 242, 0.62) 0 7px,
        rgba(14, 19, 24, 0.82) 7px 22px);
    z-index: 0;
  }

  .lg-scrim {
    position: absolute; inset: 0;
    background: radial-gradient(90% 70% at 50% 50%, rgba(6, 9, 12, 0) 30%, rgba(6, 9, 12, 0.55) 100%);
    z-index: 1;
  }

  .glass {
    position: relative;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.30), 0 24px 60px rgba(0, 0, 0, 0.38);
    z-index: 5;
  }

  .pill {
    position: absolute;
    left: 150px; top: 360px;
    width: 900px; height: 180px;
    border-radius: 90px;
  }

  .lens {
    position: absolute;
    right: 150px; top: 300px;
    width: 360px; height: 360px;
    border-radius: 50%;
  }

  .cap {
    position: absolute;
    left: 150px; top: 268px;
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(242, 244, 247, 0.45);
    z-index: 6;
  }

  .cap2 {
    position: absolute;
    right: 150px; top: 700px;
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(242, 244, 247, 0.45);
    z-index: 6;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="lg-bg"></div>
  <div class="lg-scrim"></div>

  <div class="cap">pill · radius 90</div>
  <div class="pill glass" data-glass data-refraction="92" data-bezel="0.56" data-chroma="0.55" data-map-scale="4"></div></div>

  <div class="cap2">lens · radius 50%</div>
  <div class="lens glass" data-glass data-refraction="92" data-bezel="0.56" data-chroma="0.55" data-map-scale="4"></div></div>
</div>

<script type="module">
  import { mountGlassPlate } from '../src/glass-plate.js';
  const q = new URLSearchParams(location.search);
  const REFR = q.get('refr') || '92';
  const BEZEL = q.get('bezel') || '0.56';
  const CHROMA = q.get('chroma') || '0.55';
  const MAP = q.get('mapScale') || '4';
  const BLUR = q.get('blur') || '0';
  const pill = document.querySelector('.pill');
  pill.dataset.refraction = REFR;
  pill.dataset.bezel = BEZEL;
  pill.dataset.chroma = CHROMA;
  pill.dataset.mapScale = MAP;
  pill.dataset.blur = BLUR;
  const lens = document.querySelector('.lens');
  lens.dataset.refraction = REFR;
  lens.dataset.chroma = CHROMA;
  lens.dataset.mapScale = MAP;
  lens.dataset.blur = BLUR;

  const glass = mountGlassPlate(document.querySelector('.stage'), {
    layers: ['.lg-bg', '.lg-scrim'],
    mapScale: 5,
  });
  window.__glass = glass;
  window.__glassReady = true;
</script>
</body>
</html>
